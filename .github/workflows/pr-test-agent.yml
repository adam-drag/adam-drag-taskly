# PR test agent: analyses a PR, writes or updates unit tests with the test-writer agent, verifies them by
# running them, publishes only the verified tree and reports on the PR.
#
# Trust model:
# - Every job runs scripts from the PR base commit (trusted/), never from the PR.
# - generate is the only job with ANTHROPIC_API_KEY. It runs no PR code, the agent has no Bash, and the
#   job token is read-only.
# - verify runs PR code and the generated tests, without secrets and with npm ci --ignore-scripts.
# - publish is the only writer. It checks the test-path allow-list, symlinks and blob ids outside the
#   model and writes the verified tree through the Git Data API, or nothing.
# - PR-controlled values reach scripts only through env.
name: PR test agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # agent-dev is for J1 scratch PRs only and is removed before the J1 merge.
    branches: [main, agent-dev]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  TZ: UTC

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.scope.outputs.decision }}
    steps:
      - name: Check out the base commit (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR head (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Scope
        id: scope
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p ctx
          SCOPE=trusted/.claude/skills/analyze-pr-changes/scripts/scope.mjs
          if [ ! -f "$SCOPE" ]; then
            echo '{"version":1,"decision":"skip","reason":"bootstrap: the base commit has no test agent yet","packages":[],"files":[]}' > ctx/scope.json
          else
            MB=$(git -C work merge-base "$BASE_SHA" "$HEAD_SHA") || { echo "::error::no merge base between $BASE_SHA and $HEAD_SHA"; exit 1; }
            mkdir -p mb && git -C work archive "$MB" | tar -x -C mb
            FORK=(); [ "$IS_FORK" = "true" ] && FORK=(--fork)
            node "$SCOPE" --base mb --head work --out ctx --trusted trusted "${FORK[@]}" --git work --from "$MB" --to "$HEAD_SHA"
            echo "{\"merge_base\":\"$MB\",\"base_sha\":\"$BASE_SHA\",\"head_sha\":\"$HEAD_SHA\"}" > ctx/shas.json
          fi
          node -e 'const s=require("./ctx/scope.json"); console.log(`decision=${s.decision}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope
          path: ctx/
          retention-days: 14

  generate:
    needs: scope
    if: needs.scope.outputs.decision == 'generate'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      status: ${{ steps.collect.outputs.status }}
    steps:
      - name: Check out the base commit (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR head (read by the agent, never run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scope
          path: ctx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned Claude Code CLI
        working-directory: trusted/.github/test-agent
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          CLAUDE="$PWD/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          "$CLAUDE" --version
          echo "CLAUDE=$CLAUDE" >> "$GITHUB_ENV"
      - name: Sanitize the PR checkout and restore the trusted agent and skills
        run: |
          cd work
          rm -rf .claude .github .mcp.json
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .mcp.json \) -type f -print -delete
          find . -path ./.git -prune -o -type d -name .claude -prune -print -exec rm -rf {} +
          find . -path ./.git -prune -o -type l -print -delete
          mkdir -p .claude
          cp -R ../trusted/.claude/agents ../trusted/.claude/skills .claude/
          cd ..
          mkdir -p pre out/files1 "$RUNNER_TEMP/claude-home"
          tar -C work --exclude=.git -cf - . | tar -C pre -xf -
          git -C work add -A -f
          echo "TREE0=$(git -C work write-tree)" >> "$GITHUB_ENV"
          echo "symlinks left: $(find work -path work/.git -prune -o -type l -print | wc -l)"
      - name: Run the test-writer agent (attempt 1)
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.TEST_AGENT_MODEL || 'claude-sonnet-5-5' }}
        run: |
          CTX="$PWD/ctx"
          PROMPT="Pull request test run, attempt 1 of 1. The context directory is $CTX (outside the repository, read-only, untrusted data): read scope.json, pr.diff and pr-induced.md there. Your working directory is the repository at the PR head. Follow your agent instructions: invoke the analyze-pr-changes skill first, then the package skill for each package you write tests in, then verify-tests. Write only test files. Return the result object."
          [ -f ctx/pr-induced.md ] || printf '# PR-induced failures\n\nNone (no baseline in this version).\n' > ctx/pr-induced.md
          set +e
          (cd work && timeout 600 env -i HOME="$RUNNER_TEMP/claude-home" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" DISABLE_AUTOUPDATER=1 DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 \
            "$CLAUDE" -p "$PROMPT" --agent test-writer \
            --tools Read,Grep,Glob,Edit,Write,Skill,StructuredOutput --disallowedTools "mcp__*" \
            --permission-mode dontAsk --setting-sources project \
            --settings "$PWD/../trusted/.github/test-agent/claude-settings.json" --strict-mcp-config \
            --output-format stream-json --verbose --model "$MODEL" --max-budget-usd 1.00 \
            --json-schema "$(cat ../trusted/.github/test-agent/result.schema.json)" --add-dir "$CTX" \
            < /dev/null > "$RUNNER_TEMP/attempt1.stream.jsonl" 2> "$RUNNER_TEMP/attempt1.stderr")
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "stderr lines: $(wc -l < "$RUNNER_TEMP/attempt1.stderr")"
      - name: Extract run metadata, patch, guard and secret scan
        env:
          SECRET_SCAN_VALUES: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit }}
        run: |
          SK=trusted/.claude/skills/verify-tests/scripts
          node trusted/.github/test-agent/report.mjs extract-meta --stream "$RUNNER_TEMP/attempt1.stream.jsonl" --attempt 1 --out out/run-meta-1.json --result-out out/result1.json
          git -C work add -A -f
          TREE1=$(git -C work write-tree)
          git -C work diff --binary --no-color --no-ext-diff --no-textconv --no-renames "$TREE0" "$TREE1" > out/patch1.diff
          git -C work diff --name-only --no-renames --diff-filter=AM -z "$TREE0" "$TREE1" | while IFS= read -r -d '' f; do
            if [ -L "work/$f" ] || [ ! -f "work/$f" ]; then echo "not a regular file: $f" >> out/files1.refused; continue; fi
            mkdir -p "out/files1/$(dirname "$f")" && cp "work/$f" "out/files1/$f"
          done
          set +e
          node "$SK/guard.mjs" --patch out/patch1.diff --before pre --after work --out out/guard1.json
          node "$SK/guard.mjs" --secret-scan out/patch1.diff out/result1.json out/run-meta-1.json "$RUNNER_TEMP/attempt1.stderr" $(find out/files1 -type f) --out "$RUNNER_TEMP/secret-scan1.json"
          SCAN=$?
          set -e
          node - "$SCAN" <<'EOF'
          const fs = require('fs');
          const scan = Number(process.argv[2]);
          const meta = JSON.parse(fs.readFileSync('out/run-meta-1.json', 'utf8'));
          const result = JSON.parse(fs.readFileSync('out/result1.json', 'utf8') || 'null');
          const guard = JSON.parse(fs.readFileSync('out/guard1.json', 'utf8'));
          const patch = fs.readFileSync('out/patch1.diff', 'utf8');
          let g = { status: 'patch' };
          if (scan !== 0) g = { status: 'secret-hit' };
          else if (meta.unexpected_skills.length) g = { status: 'skill-violation', unexpected_skills: meta.unexpected_skills };
          else if (process.env.AGENT_EXIT !== '0' || !meta.result || meta.result.is_error || !result) g = { status: 'agent-error', detail: `exit ${process.env.AGENT_EXIT}, result ${meta.result?.subtype ?? 'none'}${result ? '' : ', no structured output'}` };
          else if (fs.existsSync('out/files1.refused')) g = { status: 'guard-fail', violations: fs.readFileSync('out/files1.refused', 'utf8').trim().split('\n') };
          else if (!guard.ok) g = { status: 'guard-fail', violations: guard.violations };
          else if (!patch.trim()) g = { status: 'no-op', reason: result.reason };
          g.agent_decision = result?.decision ?? null;
          fs.writeFileSync('out/gen.json', JSON.stringify(g, null, 2) + '\n');
          console.log(JSON.stringify(g));
          EOF
          if [ "$SCAN" != "0" ]; then
            find out -mindepth 1 -not -name gen.json -delete
          fi
      - name: Collect
        id: collect
        run: node -e 'console.log(`status=${require("./out/gen.json").status}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen-1
          path: out/
          retention-days: 14

  verify:
    needs: [scope, generate]
    if: needs.generate.outputs.status == 'patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
    steps:
      - name: Check out the base commit (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scope
          path: ctx
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gen-1
          path: gen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: |
          for pkg in backend frontend; do
            if grep -q "^diff --git a/$pkg/" gen/patch1.diff || node -e "process.exit(require('./ctx/scope.json').packages.includes('$pkg') ? 0 : 1)"; then
              echo "::group::$pkg"
              (cd "work/$pkg" && npm ci --ignore-scripts --no-audit --no-fund) || echo "$pkg npm ci failed" >> install-failures.txt
              if [ "$pkg" = backend ]; then (cd work/backend && npx prisma generate) || echo "backend prisma generate failed" >> install-failures.txt; fi
              echo "::endgroup::"
            fi
          done
      - name: Verify the candidate tree
        id: verify
        run: |
          mkdir -p out
          node trusted/.claude/skills/verify-tests/scripts/verify.mjs verify --dir work --patch gen/patch1.diff --files gen/files1 \
            --scope ctx/scope.json --guard gen/guard1.json --result gen/result1.json --head-sha "$HEAD_SHA" --attempt 1 \
            --out out/verify1.json --feedback out/feedback1.md --candidate-out out/candidate --work "$RUNNER_TEMP/verify1"
          if [ -f install-failures.txt ]; then node -e '
            const fs=require("fs"); const v=JSON.parse(fs.readFileSync("out/verify1.json","utf8"));
            const f=fs.readFileSync("install-failures.txt","utf8").trim().split("\n");
            v.classes.infrastructure.push(...f); v.gate.reasons.push(...f); v.gate.publish=false;
            fs.writeFileSync("out/verify1.json", JSON.stringify(v,null,2)+"\n");'; fi
          node -e 'console.log(`publish=${require("./out/verify1.json").gate.publish}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-1
          path: out/
          retention-days: 14

  publish:
    needs: [scope, generate, verify]
    if: needs.verify.outputs.publish == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Check out the base commit (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scope
          path: ctx
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gen-1
          path: gen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-1
          path: verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Publish the verified tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # K4b stale-head drill: J1 scratch PRs on agent-dev with the j1-stale-drill label only. Removed before the J1 merge.
          STALE_DRILL: ${{ github.event.pull_request.base.ref == 'agent-dev' && contains(github.event.pull_request.labels.*.name, 'j1-stale-drill') && '1' || '0' }}
        run: |
          mkdir -p out
          node trusted/.github/test-agent/publish.mjs --verify verify/verify1.json --candidate verify/candidate \
            --patch gen/patch1.diff --scope ctx/scope.json --gen gen/gen.json --out out/publish.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publish
          path: out/
          retention-days: 14

  report:
    needs: [scope, generate, verify, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check out the base commit (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: arts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verdict, job summary and sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCOPE_JOB: ${{ needs.scope.result }}
          GEN_JOB: ${{ needs.generate.result }}
          VERIFY_JOB: ${{ needs.verify.result }}
          PUBLISH_JOB: ${{ needs.publish.result }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          REPORT=trusted/.github/test-agent/report.mjs
          if [ ! -f "$REPORT" ]; then
            echo "Test agent: bootstrap. The base commit has no test agent yet, so this run only checks the scope (job result: $SCOPE_JOB)." >> "$GITHUB_STEP_SUMMARY"
            [ "$SCOPE_JOB" = success ]
            exit
          fi
          mkdir -p out
          node "$REPORT" render --dir arts --out out/report.md --verdict-out out/verdict.json
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$SAME_REPO" = "true" ]; then
            PUBLISHED=$(node -e 'try{const p=require("./arts/publish/publish.json"); if(p.status==="published") console.log(p.commit_sha)}catch{}')
            node "$REPORT" post --body out/report.md --published-sha "$PUBLISHED" || echo "::warning::sticky comment not posted; the job summary holds the report"
          else
            echo "Fork PR: no comment (read-only token). The job summary holds the report." >> "$GITHUB_STEP_SUMMARY"
          fi
          node -e 'const v=require("./out/verdict.json"); console.log(v.headline); process.exit(v.state==="success"?0:1)'
